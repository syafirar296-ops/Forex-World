<link id="appIcon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23121413'/%3E%3Ccircle cx='256' cy='256' r='150' fill='none' stroke='%23fff' stroke-width='26'/%3E%3Cpath d='M256 168V256H334' fill='none' stroke='%23fff' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link id="appleIcon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23121413'/%3E%3Ccircle cx='256' cy='256' r='150' fill='none' stroke='%23fff' stroke-width='26'/%3E%3Cpath d='M256 168V256H334' fill='none' stroke='%23fff' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
/* =====================================================
   PWA SINGLE-FILE
   - Logo: ikon jam (cincin + jarum)
   - Manifest dibuat otomatis
   - Mendukung tombol Install / Add to Home Screen
===================================================== */
(function(){
  var BG='#121413';
  function makeIcon(size,k){
    k=k||1;
    var c=document.createElement('canvas');
    c.width=c.height=size;
    var x=c.getContext('2d');
    x.fillStyle=BG;
    x.fillRect(0,0,size,size);

    /* skala 512 -> size, k<1 = ruang aman untuk maskable */
    var s=size/512*k, o=size*(1-k)/2;
    x.translate(o,o);
    x.strokeStyle='#fff';
    x.lineWidth=26*s;
    x.lineCap='round';
    x.lineJoin='round';

    /* cincin jam */
    x.beginPath();
    x.arc(256*s,256*s,150*s,0,Math.PI*2);
    x.stroke();

    /* jarum jam: ke atas lalu ke kanan */
    x.beginPath();
    x.moveTo(256*s,168*s);
    x.lineTo(256*s,256*s);
    x.lineTo(334*s,256*s);
    x.stroke();

    return c.toDataURL('image/png');
  }

  try{
    var i192=makeIcon(192), i512=makeIcon(512);
    var apple=makeIcon(180), m512=makeIcon(512,.72);

    document.getElementById('appleIcon').href=apple;
    document.getElementById('appIcon').href=i192;
    document.getElementById('appIcon').type='image/png';

    var base=location.href.split('#')[0].split('?')[0];
    var manifest={
      name:'Forex World Cloud',
      short_name:'Forex World',
      description:'Forex World Cloud — live exchange rates of world currencies (TradingView)',
      start_url:base,
      scope:base.replace(/[^\/]*$/,''),
      id:base,
      display:'standalone',
      orientation:'portrait',
      background_color:'#121413',
      theme_color:'#121413',
      prefer_related_applications:false,
      icons:[
        {src:i192,sizes:'192x192',type:'image/png',purpose:'any'},
        {src:i512,sizes:'512x512',type:'image/png',purpose:'any'},
        {src:m512,sizes:'512x512',type:'image/png',purpose:'maskable'}
      ]
    };

    var l=document.createElement('link');
    l.rel='manifest';
    l.href=URL.createObjectURL(
      new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'})
    );
    document.head.appendChild(l);
  }catch(e){
    console.warn('PWA setup failed',e);
  }
})();
</script>

===================================================== */

.stockCard{
  position:absolute;

  left:0;
  top:0;

  width:var(--size);
  height:var(--size);

  border-radius:50%;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  will-change:transform;

  cursor:grab;

  transform:
    translate3d(
      var(--x),
      var(--y),
      0

    rotate(
      var(--rot)
    )
    scale(var(--pulse,1));

}

.stockCard.dragging{
  z-index:60000;
  cursor:grabbing;
}

.stockBody{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:
    1px solid

  background:

html,body,.app,.app.listMode{background:#000 var(--bgImg) center/cover no-repeat !important}
.app.listMode .stockList,.stockList{background:transparent !important}
.stockRow{border-bottom-color:rgba(255,255,255,.12) !important}
.stockRow:active{background:rgba(255,255,255,.08) !important}
.stockRow .rSym{color:#fff !important}
.stockRow .rName{color:#b5b5b5 !important}
.stockRow .rPrice{color:#f0f0f0 !important}
.stockRow .rStar{color:#bbb}.stockRow .rStar.active{color:#7dfa00}
.searchButton,.barcodeLink,.pageButton,.searchPanel .searchButton,.app .searchButton,.app .barcodeLink{color:#fff !important}
.app:not(.listMode) .pageButton svg,.app:not(.listMode) .searchButton svg,.barcodeLink svg,.searchButton svg,.pageButton svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.8)) !important}
.searchPanel:not(.listOnly) input,.searchPanel input{color:#fff !important}
.searchPanel input::placeholder{color:#bbb !important}
.pageMenu,.popup{background:rgba(6,6,8,.9) !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.pageMenu,.pageMenu *,.popup,.popup *,.qrCard,.qrCard *{font-family:'Nunito','Varela Round',ui-rounded,'SF Pro Rounded','Quicksand','Segoe UI',system-ui,sans-serif !important}
.pageMenu .menuHead,.popupHead{background:transparent !important}
.pageMenu .menuHead .menuTitle,.popupHead .popupName,.popupHead .popupSymbol,.popup .close,.pageMenu .menuHead .viewBtn,.pageMenu .menuHead .favoriteHeadBtn,.pageMenu .menuHead .bellHeadBtn{color:#fff !important}
.pageMenu .menuHead .menuTitle{color:#7dfa00 !important}

/* ===== Bubble hitam transparan + list memakai gambar latar ===== */
.stockBody,.stockBody.gainUp,.stockBody.gainDown{background:rgba(0,0,0,.5) !important}
.stockSymbol,.stockBody.gainUp .stockSymbol,.stockBody.gainDown .stockSymbol{color:#fff !important}
.stockPrice,.stockBody.gainUp .stockPrice,.stockBody.gainDown .stockPrice{color:#e6e6e6 !important}
.stockBody .stockGain.up{color:#7dfa00 !important}
.stockBody .stockGain.down{color:#fb038d !important}
.app.listMode,.app.listMode .stockList,.stockList,#listRows,.listBar{background:transparent !important}
.app.listMode{background:#000 var(--bgImg) center/cover no-repeat !important}
.listBar::before{display:none !important}
.listBar .rankBtn,.listBar .funnelBtn{color:#fff !important}
.listBar .rankBtn svg{stroke:#ddd !important}
.listFooter{background:transparent !important}

/* ===== Update: logo transparan, search di kiri, QR di menu ===== */
.stockLogo,.popupLogo,.popupHead .popupLogo,.stockRow img,.searchResult img{background:transparent !important}
.searchPanel{left:12px !important;right:auto !important}
.searchResults{left:12px !important;right:auto !important}
.menuHead .qrHeadBtn{color:#7dfa00 !important}
@media(max-width:600px){.searchPanel{left:12px !important;right:auto !important}.searchResults{left:12px !important;right:auto !important}}

/* ===== Indeks pasar: 1 dropdown + sub dropdown ===== */
.idxSub{border-bottom:1px solid #1c1c1c}.idxSub:last-child{border-bottom:0}
.idxSubHead{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 14px;background:#141414;color:#fff;border:0;font:700 12.5px inherit;font-family:inherit;cursor:pointer}
.idxSubHead svg{transition:transform .2s}.idxSub.open .idxSubHead svg{transform:rotate(180deg)}
.idxSub.hasActive .idxSubHead{color:#7dfa00}
.idxSubBody{display:none;background:#0b0b0b}.idxSub.open .idxSubBody{display:block}
.idxSubBody .idxOpt{padding-left:22px}

/* ===== Menu: ukuran halaman tetap, isi di-scroll; logo transparan ===== */
html body .pageMenu{height:min(calc(100dvh - 220px),470px) !important;max-height:calc(100dvh - 220px) !important;overflow-y:auto !important;overflow-x:hidden !important}
html body .pageMenu .menuHead{position:sticky !important;top:0;z-index:5;background:rgba(10,12,10,.97) !important}
html body .stockBody .stockLogo,html body .stockRow img,html body .popupHead .popupLogo,html body .popupLogo,html body .searchResult img,html body .searchResult .stockLogo{background:transparent !important;background-color:transparent !important}

<script>

/* =====================================================
   CONFIG
===================================================== */

const IDX_LIST=[];
let TOTAL_STOCKS = 0;

const STOCKS_PER_PAGE = 100;

const TOTAL_PAGES =
  Math.ceil(
    TOTAL_STOCKS /
    STOCKS_PER_PAGE
  );

const MIN_SIZE = 52;

const MAX_SIZE = 118;

const SAFE_TOP = 55;


/* =====================================================
   STATE
===================================================== */

let allStocks = [];

let visibleStocks = [];

let currentPage = 0;

let selectedStock = null;

let drag = null;

let socket = null;
let reconnectTimer = null;
let liveReconnectAttempt = 0;
const LIVE_REFRESH_MS = 15000;

/* CACHE: simpan semua saham di localStorage, request TradingView maksimal tiap 5 menit */
const CACHE_KEY='forex_world_cache_v1';
const CACHE_MS=5*60*1000; /* cache & refresh every 5 minutes */
let lastAttemptTs=0;
function readStockCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY); if(!raw)return null;
    const c=JSON.parse(raw);
    if(c&&Array.isArray(c.stocks)&&c.stocks.length&&Number.isFinite(c.ts))return c;
  }catch(e){}
  return null;
}
function writeStockCache(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),stocks:allStocks}));}catch(e){}
}
function indexStocks(){
  stockMap.clear(); stockBySymbol.clear();
  allStocks.forEach((stock,index)=>{stock.market_cap_rank=index+1;stockMap.set(stock.id,stock);stockBySymbol.set(stock.symbol.toUpperCase(),stock);});
}

let positions = new Map();

let nodes = new Map();

let stockMap = new Map();
let stockBySymbol = new Map();


/* =====================================================
   DOM
===================================================== */

const cloud =
  document.getElementById(
    'cloud'
  );

const pageButton =
  document.getElementById(
    'pageButton'
  );

const pageMenu =
  document.getElementById(
    'pageMenu'
  );


/* =====================================================
   FORMAT
===================================================== */

function price(v){
  if(v==null||v==='')return '—'; v=Number(v); if(!isFinite(v))return '—';
  const d=v>=1000?2:v>=100?3:v>=10?4:v>=1?5:6;
  return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:d});
}


function percent(v){

  if(v==null)
    return '—';

  v=Number(v);

  return (
    v>=0
      ?'+'
      :''
  )+
  v.toFixed(2)+
  '%';
}


function large(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return ''+
      (v/1e12).toFixed(2)+
      'T';

  if(v>=1e9)
    return ''+
      (v/1e9).toFixed(2)+
      'B';

  if(v>=1e6)
    return ''+
      (v/1e6).toFixed(2)+
      'M';

  if(v>=1e3)
    return ''+
      (v/1e3).toFixed(2)+
      'K';

  return ''+
    v.toLocaleString();
}


function supply(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return (v/1e12).toFixed(2)+'T';

  if(v>=1e9)
    return (v/1e9).toFixed(2)+'B';

  if(v>=1e6)
    return (v/1e6).toFixed(2)+'M';

  return v.toLocaleString(
    'en-US',
    {
      maximumFractionDigits:0
    }
  );
}


/* =====================================================
   stock SIZE BASED ON GAIN
===================================================== */

/* Ukuran dasar (dipakai persis di 1H, yang sudah pas). */
function baseSizeFromGain(gain){
  const g=Math.min(Math.abs(Number(gain)||0),100);
  const n=Math.pow(g/100,.48);
  return Math.round(MIN_SIZE+(MAX_SIZE-MIN_SIZE)*n);
}

/* 4H / 1D / 1W / 1M / 1Y: sebaran ukuran dibuat sama dengan 1H.
   Bubble diurutkan menurut |gain| di time frame aktif, lalu diberi ukuran
   dari sebaran ukuran 1H pada urutan yang sama -> gain besar tetap paling besar. */
const FOLLOW_1H=['4H','1D','1W','1M','1Y'];
let followCache={key:'',gains:[],sizes:[]};

function getFollowCache(){
  const key=activeTimeFrame+'#'+allStocks.length+'#'+visibleStocks.length+'#'+(visibleStocks[0]?visibleStocks[0].id:'');
  if(followCache.key===key)return followCache;
  // sebaran ukuran 1H: 100 teratas menurut gain 1H, formula ukuran asli
  const ref=[...allStocks]
    .sort((x,y)=>getLiveTimeframeGain(y,'1H')-getLiveTimeframeGain(x,'1H'))
    .slice(0,STOCKS_PER_PAGE)
    .map(st=>baseSizeFromGain(getLiveTimeframeGain(st,'1H')))
    .sort((x,y)=>x-y);
  const gains=visibleStocks
    .map(st=>Math.abs(Number(bubbleGain(st))||0))
    .sort((x,y)=>x-y);
  followCache={key:key,gains:gains,sizes:ref};
  return followCache;
}

var BUBBLE_SCALE=1.15;
function sizeFromGain(gain){return Math.max(1,Math.round(sizeFromGainRaw(gain)*BUBBLE_SCALE));}
function sizeFromGainRaw(gain){
  if(FOLLOW_1H.indexOf(activeTimeFrame)>=0){
    const c=getFollowCache();
    const n=c.gains.length, m=c.sizes.length;
    if(n>1&&m>1&&c.sizes[m-1]>c.sizes[0]){
      const g=Math.abs(Number(gain)||0);
      // posisi g di antara gain terurut (0..1), dengan interpolasi
      let lo=0,hi=n;
      while(lo<hi){const mid=(lo+hi)>>1; if(c.gains[mid]<g)lo=mid+1; else hi=mid;}
      let first=lo;
      hi=n;
      while(lo<hi){const mid=(lo+hi)>>1; if(c.gains[mid]<=g)lo=mid+1; else hi=mid;}
      const q=((first+Math.max(first,lo-1))/2)/(n-1);
      const pos=Math.min(1,Math.max(0,q))*(m-1);
      const i=Math.floor(pos), f=pos-i;
      const v=c.sizes[i]+(c.sizes[Math.min(m-1,i+1)]-c.sizes[i])*f;
      return Math.round(v);
    }
  }
  return baseSizeFromGain(gain);
}

function random(min,max){

  return Math.random()*
    (max-min)+min;
}

function getLiveTimeframeGain(c,name){
  if(name==='1H')return Number(c.price_change_percentage_1h_in_currency)||0;
  if(name==='1D')return Number(c.price_change_percentage_24h)||0;
  if(name==='1W')return Number(c.price_change_percentage_7d_in_currency)||0;
  if(name==='1M')return Number(c.price_change_percentage_30d_in_currency)||0;
  if(name==='4H')return Number(c.price_change_percentage_4h_in_currency)||0;
  if(name==='1Y')return Number(c.price_change_percentage_1y_in_currency)||0;
  return Number(c.price_change_percentage_24h)||0;
}
function bubbleGain(s){return ['1H','4H','1D','1W','1M','1Y'].indexOf(activeTimeFrame)>=0?getLiveTimeframeGain(s,activeTimeFrame):(Number(s.price_change_percentage_24h)||0);}
function applyTimeFilter(name){
  if(!allStocks.length)return;
  listSource='menu';
  if(name.startsWith('Rank')){
    activeTimeFrame='RANK';
    const m=name.match(/(\d+)[–-](\d+)/);
    const base=poolStocks().slice(Number(m[1])-1,Number(m[2]));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }else{
    activeTimeFrame=name;
    const base=[...poolStocks()];
    base.sort((a,b)=>getLiveTimeframeGain(b,name)-getLiveTimeframeGain(a,name));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }
  document.querySelectorAll('.tfTab').forEach(b=>b.classList.toggle('active',b.dataset.tf===activeTimeFrame));
  rebuildCloud();
}

/* Fast cloud rebuild: keeps bubbles that stay, reuses cards from the pool, creates only what is new,
   and adds everything with ONE DOM insert (no more rebuilding 100 bubbles + logos on every tap). */
function setBubbleZ(card,gain){
  if(!card)return;
  const z=10+Math.min(8000,Math.round(Math.abs(Number(gain)||0)*10));
  if(card.__z!==z){card.__z=z;card.style.setProperty('--z',z);}
}
function refreshNode(stock,n){
  const gain=bubbleGain(stock);
  setBubbleZ(n.card,gain);
  const pe=price(stock.current_price); if(n.priceEl.textContent!==pe)n.priceEl.textContent=pe;
  const ge=percent(gain); if(n.gainEl.textContent!==ge)n.gainEl.textContent=ge;
  n.gainEl.className='stockGain '+(gain>=0?'up':'down');
  n.body.classList.toggle('gainUp',gain>=0);
  n.body.classList.toggle('gainDown',gain<0);
  n.card.classList.remove('dragging');
}
function rebuildCloud(){
  if(viewMode==='list'){cloudDirty=true;renderStockList();return;}
  cloudDirty=false;
  const sig=activeTimeFrame+'#'+visibleStocks.map(c=>c.id).join('|');
  const same=(sig===lastCloudSig&&visibleStocks.length>0&&nodes.size===visibleStocks.length);
  lastCloudSig=sig;
  if(!same)createPositions();
  const keep=new Set(visibleStocks.map(c=>c.id));
  nodes.forEach((n,id)=>{
    if(!keep.has(id)){
      if(n.card.parentNode)n.card.parentNode.removeChild(n.card);
      cardPool.set(id,n); nodes.delete(id);
    }
  });
  while(cardPool.size>300)cardPool.delete(cardPool.keys().next().value);
  const frag=document.createDocumentFragment();
  visibleStocks.forEach(stock=>{
    let n=nodes.get(stock.id);
    if(n){refreshNode(stock,n);applyPosition(stock.id);return;}
    n=cardPool.get(stock.id);
    if(n){cardPool.delete(stock.id);nodes.set(stock.id,n);refreshNode(stock,n);applyPosition(stock.id);frag.appendChild(n.card);return;}
    frag.appendChild(createStock(stock));
  });
  cloud.appendChild(frag);
}

function refreshActiveTimeframe(){
  if(!allStocks.length)return;
  if(activeTimeFrame==='RANK')return;
  const base=[...poolStocks()].sort((a,b)=>getLiveTimeframeGain(b,activeTimeFrame)-getLiveTimeframeGain(a,activeTimeFrame));
  visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  visibleStocks.forEach(c=>updateStock(c));
  // Rebuild only when the ordering changes so the live cloud follows the selected timeframe.
  const ids=visibleStocks.map(c=>c.id).join('|');
  const currentIds=[...nodes.keys()].join('|');
  if(ids!==currentIds){
    rebuildCloud();
  }
}

/* =====================================================
   POSITIONS
===================================================== */

function createPositions(){

  if(viewMode==='list')renderStockList();

  positions.clear();

  followCache.key='';

  const width=
    innerWidth;

  const height=
    innerHeight;

  const placed=[];

  [...visibleStocks].sort((x,y)=>sizeFromGain(bubbleGain(y))-sizeFromGain(bubbleGain(x))).forEach(
    stock=>{

      const size=
        sizeFromGain(bubbleGain(stock));

      let x=0;
      let y=0;

      let found=false;

      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x=
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );

        let good=true;

        for(
          const p of placed
        ){

          const dx=
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );

          const dy=
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );

          const minimum=(size/2+p.size/2)*.78;

          if(dx*dx+dy*dy<minimum*minimum){

            good=false;

            break;

          }

        }

        if(good){

          found=true;

          break;

        }

      }

      if(!found){

        x=
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }

      const p={

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00032,
            .00072
          ),

        speedY:
          random(
            .00028,
            .00068
          ),

        amplitudeX:
          random(2.0,5.0),

        amplitudeY:
          random(2.0,5.0),

        rotation:0,

        pulsePhase:
          Math.random()*
          Math.PI*2,

        pulseSpeed:
          random(
            .00065,
            .00125
          ),

        rotSpeed:
          random(
            .00012,
            .00032
          )

      };

      placed.push(p);

      positions.set(
        stock.id,
        p
      );

    }
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  p.x=
    Math.max(
      0,
      Math.min(
        maxX,
        p.x
      )
    );

  p.y=
    Math.max(
      SAFE_TOP,
      Math.min(
        maxY,
        p.y
      )
    );

}


function bounceFromEdges(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  const bounce=.82;

  if(
    p.x<=0
  ){

    p.x=0;

    if(p.vx<0)
      p.vx=
        -p.vx*bounce;

  }else if(
    p.x>=maxX
  ){

    p.x=maxX;

    if(p.vx>0)
      p.vx=
        -p.vx*bounce;

  }

  if(
    p.y<=SAFE_TOP
  ){

    p.y=SAFE_TOP;

    if(p.vy<0)
      p.vy=
        -p.vy*bounce;

  }else if(
    p.y>=maxY
  ){

    p.y=maxY;

    if(p.vy>0)
      p.vy=
        -p.vy*bounce;

  }

}


/* =====================================================
   APPLY
===================================================== */

function applyPosition(id){
  const p=positions.get(id);
  const node=nodes.get(id);
  if(!p||!node)return;
  const st=node.card.style;
  if(node.__sz!==p.size){node.__sz=p.size;st.setProperty('--size',p.size+'px');}
  const pulse=1+Math.sin(performance.now()*p.pulseSpeed+p.pulsePhase)*.035;
  st.transform='translate3d('+p.x.toFixed(2)+'px,'+p.y.toFixed(2)+'px,0) rotate('+p.rotation.toFixed(2)+'deg) scale('+pulse.toFixed(3)+')';
}

function createStock(stock){

  const card=
    document.createElement(
      'div'
    );

  card.className=
    'stockCard';

  const body=
    document.createElement(
      'div'
    );

  body.className=
    'stockBody';

  const logo=
    document.createElement(
      'img'
    );

  logo.className=
    'stockLogo';

  setReliableLogo(logo,stock.symbol);

  logo.draggable=false;
  logo.loading='eager';
  logo.decoding='async';

  const symbol=
    document.createElement(
      'div'
    );

  symbol.className=
    'stockSymbol';

  symbol.textContent=
    stock.symbol.toUpperCase();

  const priceEl=
    document.createElement(
      'div'
    );

  priceEl.className=
    'stockPrice';

  priceEl.textContent=
    price(
      stock.current_price
    );

  const gain=bubbleGain(stock);

  const gainEl=
    document.createElement(
      'div'
    );

  gainEl.className=
    'stockGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  gainEl.textContent=
    percent(gain);

  body.appendChild(logo);
  body.appendChild(symbol);
  body.appendChild(priceEl);
  body.appendChild(gainEl);

  body.classList.add(gain>=0?'gainUp':'gainDown');

  card.appendChild(body);
  setBubbleZ(card,gain);

  nodes.set(
    stock.id,
    {
      card:card,
      body:body,
      logo:logo,
      priceEl:priceEl,
      gainEl:gainEl
    }
  );

  enableDrag(
    card,
    stock.id
  );

  applyPosition(
    stock.id
  );

  return card;

}

  const d=r.d||[], tv=String(r.s||''); const sym=String(d[0]||tv.split(':')[1]||'').toUpperCase();
  const cur=fxCur(sym), x=FX_MAP[cur];
  const cn=String(d[1]||'').split(' / ')[1]||cur;
  return {symbol:sym,tv:tv,name:(x?fxCountry(x.i)+' — ':'')+cn,price:d[2],pct:d[3],high:d[4],low:d[5],vol:d[6],cap:null,logoid:'',p1h:d[10],p4h:d[11],pw:d[12],pm:d[13],py:d[14],ord:x?FX_ORD[cur]:9999};
}
async function tvScan(body,scanUrl){
  scanUrl=scanUrl||TV_SCAN_URL;
  let payload=JSON.stringify(Object.assign({columns:TV_COLS},body));
  const post=u=>fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:payload});
  let r;
  try{r=await post(scanUrl);}catch(e){r=null;}
  if(r&&r.status===400){payload=JSON.stringify(Object.assign({columns:TV_COLS.slice(0,TV_CORE)},body));try{r=await post(scanUrl);}catch(e){r=null;}}
  /* jika diblokir (CORS di GitHub Pages), coba lewat proxy */
  if(!r||!r.ok){
    for(const mk of [u=>'https://corsproxy.io/?'+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)]){
      try{const rr=await post(mk(scanUrl)); if(rr.ok){r=rr;break;}}catch(e){}
    }
  }
  if(!r||!r.ok)throw new Error('TradingView HTTP '+(r?r.status:'failed'));
  const j=await r.json(); return (j.data||[]).map(tvRowToQuote).filter(q=>q.symbol);
}
/* semua mata uang dunia vs USD (FX_IDC), urut: mata uang utama dulu */
async function fetchAllQuotes(){
  const body={symbols:{tickers:FX_TICKERS,query:{types:[]}}};
  let list=[]; try{list=await tvScan(body);}catch(e){}
  if(list.length<20)list=await tvScan(body,'https://scanner.tradingview.com/global/scan');
  return list.sort((a,b)=>a.ord-b.ord);
}
/* dipakai pencarian untuk pasangan yang belum ada di daftar (mis. EURJPY) */
async function fetchQuotes(syms){
  const body={symbols:{tickers:syms.map(s=>'FX_IDC:'+s),query:{types:[]}}};
  let list=[]; try{list=await tvScan(body);}catch(e){}
  if(!list.length)list=await tvScan(body,'https://scanner.tradingview.com/global/scan');
  const map=new Map(); list.forEach(q=>{if(q.price>0)map.set(q.symbol,q);});
  if(!map.size)throw new Error('Data kosong'); return map;
}
function applyQuote(stock,q){
  if(q.price!=null)stock.current_price=q.price; if(q.pct!=null)stock.price_change_percentage_24h=q.pct;
  if(q.vol!=null)stock.total_volume=q.vol; if(q.cap!=null)stock.market_cap=q.cap;
  if(q.high!=null)stock.high_24h=q.high; if(q.low!=null)stock.low_24h=q.low;
  if(q.logoid)stock.logoid=q.logoid; if(q.tv)stock.tv_symbol=q.tv;
  if(q.p1h!=null)stock.price_change_percentage_1h_in_currency=q.p1h; if(q.p4h!=null)stock.price_change_percentage_4h_in_currency=q.p4h;
  if(q.pw!=null)stock.price_change_percentage_7d_in_currency=q.pw; if(q.pm!=null)stock.price_change_percentage_30d_in_currency=q.pm; if(q.py!=null)stock.price_change_percentage_1y_in_currency=q.py;
  if(q.name&&(stock.name===stock.symbol||!stock.name))stock.name=String(q.name);
}

  /* Initial load is intentionally empty:
     no legacy/placeholder IDX bubbles are shown.
     The first bubbles rendered come from TradingView. */
  allStocks=[];
  visibleStocks=[];
  TOTAL_STOCKS=0;
  lastAttemptTs=0;
  const cached=readStockCache();
  if(cached){   /* tampilkan data cache langsung, harga terbaru diambil di background */
    allStocks=cached.stocks; TOTAL_STOCKS=allStocks.length; lastAttemptTs=cached.ts;
  }

let tvRefreshBusy=false;
async function refreshTradingViewPrices(force){
  if(tvRefreshBusy)return;
  if(!force&&Date.now()-lastAttemptTs<CACHE_MS)return; /* cache masih segar, tidak ambil data */
  tvRefreshBusy=true;
  try{
    const quotes=await fetchAllQuotes();
    if(quotes.length<20)throw new Error('Not enough data');
    const prev=new Map(allStocks.map(s=>[s.symbol,s])), seen=new Set(), next=[]; let changed=quotes.length!==allStocks.length;
    quotes.forEach(q=>{
      if(seen.has(q.symbol))return; seen.add(q.symbol);
      let s=prev.get(q.symbol); if(!s){s=skeletonStock({symbol:q.symbol,name:q.name});changed=true;}
      applyQuote(s,q); next.push(s);
    });
    lastAttemptTs=Date.now();
    if(changed||quotes.some((q,i)=>!allStocks[i]||allStocks[i].symbol!==q.symbol)){
      allStocks=next; TOTAL_STOCKS=allStocks.length; indexStocks();
      if(window.__fillRank)window.__fillRank(); createPageMenu(); renderCurrentPage();
    }else{
      const arr=allStocks.slice(); let ci=0;
      await new Promise(res=>{(function step(){
        const end=Math.min(arr.length,ci+60);
        for(;ci<end;ci++){const stock=arr[ci];updateStock(stock);if(selectedStock&&selectedStock.id===stock.id)updatePopup(stock);}
        if(ci<arr.length)requestAnimationFrame(step);else res();
      })();});
    }
    writeStockCache();
    setLiveStatus('live','TRADINGVIEW '+new Date().toLocaleTimeString('en-GB')+' · '+allStocks.length+' pairs');
  }catch(e){
    console.warn('TradingView failed',e);
    setLiveStatus('error','TV: '+String(e&&e.message||e).slice(0,60));
  }finally{tvRefreshBusy=false;}
}
function connectStockData(){clearInterval(window.__tvRefreshTimer);window.__tvRefreshTimer=setInterval(refreshTradingViewPrices,CACHE_MS);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>{if(!document.hidden)refreshTradingViewPrices();},2500);});


function updateStock(stock){

  updateListRow(stock);

  const node=
    nodes.get(
      stock.id
    );

  if(!node)
    return;

  node.priceEl.textContent=
    price(
      stock.current_price
    );

  const gain=bubbleGain(stock);
  setBubbleZ(node.card,gain);

  node.gainEl.textContent=
    percent(gain);

  node.gainEl.className=
    'stockGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  if(node.body){
    node.body.classList.toggle('gainUp',gain>=0);
    node.body.classList.toggle('gainDown',gain<0);
  }

  const p=
    positions.get(
      stock.id
    );

  if(!p)
    return;

  const oldSize=
    p.size;

  const newSize=
    sizeFromGain(
      gain
    );

  if(
    Math.abs(
      oldSize-newSize
    )>=1
  ){

    const cx=
      p.x+
      oldSize/2;

    const cy=
      p.y+
      oldSize/2;

    p.size=
      newSize;

    p.x=
      cx-
      newSize/2;

    p.y=
      cy-
      newSize/2;

    p.homeX=p.x;p.homeY=p.y;
    clampPosition(p);

    applyPosition(
      stock.id
    );

  }

}


/* =====================================================
   DRAG
===================================================== */

function enableDrag(
  card,
  id
){

  let pointerId=null;

  let startPointerX=0;
  let startPointerY=0;

  let startX=0;
  let startY=0;

  let lastX=0;
  let lastY=0;

  let velocityX=0;
  let velocityY=0;

  let moved=false;

  card.addEventListener(
    'pointerdown',
    e=>{

      const p=
        positions.get(id);

      if(!p)
        return;

      pointerId=
        e.pointerId;

      card.setPointerCapture(
        pointerId
      );

      startPointerX=
        e.clientX;

      startPointerY=
        e.clientY;

      startX=p.x;
      startY=p.y;

      lastX=e.clientX;
      lastY=e.clientY;

      velocityX=0;
      velocityY=0;

      moved=false;

      drag={
        id:id
      };

      card.classList.add(
        'dragging'
      );

    },
    {
      passive:true
    }
  );

  card.addEventListener(
    'pointermove',
    e=>{

      if(
        pointerId!==
        e.pointerId
      )
        return;

      if(
        !drag ||
        drag.id!==id
      )
        return;

      const p=
        positions.get(id);

      if(!p)
        return;

      const dx=
        e.clientX-
        startPointerX;

      const dy=
        e.clientY-
        startPointerY;

      if(
        Math.abs(dx)>3 ||
        Math.abs(dy)>3
      ){

        moved=true;

      }

      p.x=
        startX+
        dx;

      p.y=
        startY+
        dy;

      clampPosition(p);

      velocityX=
        velocityX*.55+
        (
          e.clientX-
          lastX
        )*.45;

      velocityY=
        velocityY*.55+
        (
          e.clientY-
          lastY
        )*.45;

      lastX=e.clientX;
      lastY=e.clientY;

      p.rotation=
        Math.max(
          -7,
          Math.min(
            7,
            velocityX*.7
          )
        );

      pushNeighbors(
        id,
        velocityX,
        velocityY
      );

      applyPosition(id);

    },
    {
      passive:true
    }
  );

  function release(e){

    if(
      pointerId!==
      e.pointerId
    )
      return;

    pointerId=null;

    const p=
      positions.get(id);

    if(p){

      p.vx+=velocityX*.25;p.vy+=velocityY*.25;

      p.rotation=0;

    }

    card.classList.remove(
      'dragging'
    );

    const wasClick=
      !moved;

    drag=null;

    if(wasClick && (performance.now()-(window.__pdT||0))<600 && !window.__pausePhys){

      openPopup(id);

    }

  }

  card.addEventListener(
    'pointerup',
    release
  );

  card.addEventListener(
    'pointercancel',
    release
  );

}


/* =====================================================
   PUSH NEIGHBORS
===================================================== */

function pushNeighbors(
  movingId,
  vx,
  vy
){

  const moving=
    positions.get(
      movingId
    );

  if(!moving)
    return;

  positions.forEach(
    (other,id)=>{

      if(
        id===
        movingId
      )
        return;

      const dx=
        (
          other.x+
          other.size/2
        )-
        (
          moving.x+
          moving.size/2
        );

      const dy=
        (
          other.y+
          other.size/2
        )-
        (
          moving.y+
          moving.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          moving.size/2+
          other.size/2
        )*.92;

      if(
        distance<
        minimum
      ){

        const d=
          Math.max(
            distance,
            .001
          );

        const nx=
          dx/d;

        const ny=
          dy/d;

        const overlap=
          minimum-distance;

        const speed=
          Math.min(
            13,
            Math.sqrt(
              vx*vx+
              vy*vy
            )
          );

        const impulse=
          overlap*.95+
          speed*.42;

        other.vx+=
          nx*
          impulse;

        other.vy+=
          ny*
          impulse;

        other.rotation+=
          nx*
          impulse*
          .7;

        other.vx=
          Math.max(
            -8,
            Math.min(
              8,
              other.vx
            )
          );

        other.vy=
          Math.max(
            -8,
            Math.min(
              8,
              other.vy
            )
          );

        clampPosition(
          other
        );

      }

    }
  );

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

function animate(){

  if(window.__pausePhys){requestAnimationFrame(animate);return;}

  const now=performance.now();
  const dt=Math.min(2.5,Math.max(.5,(now-(window.__lastT||now))/16.667));window.__lastT=now;
  const damp=Math.pow(.90,dt);
  positions.forEach(
    (p,id)=>{

      const held=
        drag &&
        drag.id===
        id;

      if(!held){

        const fx=
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;

        const fy=
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;

        const targetX=
          p.homeX+
          fx;

        const targetY=
          p.homeY+
          fy;

        p.vx+=(targetX-p.x)*.022*dt;

        p.vy+=(targetY-p.y)*.022*dt;

        p.vx*=damp;p.vy*=damp;
        p.x+=p.vx*dt;p.y+=p.vy*dt;

        p.rotation+=(Math.sin(now*p.rotSpeed+p.phaseX)*2.2-p.rotation)*Math.min(1,.12*dt);

      }

      bounceFromEdges(p);

      clampPosition(p);

      applyPosition(id);

    }
  );

  collisionPhysics();

  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   COLLISION
===================================================== */

function collisionPhysics(){
  const arr=Array.from(positions.values());
  const n=arr.length;
  for(let i=0;i<n;i++){
    const a=arr[i];
    const ar=a.size/2, acx=a.x+ar, acy=a.y+ar;
    for(let j=i+1;j<n;j++){
      const b=arr[j];
      const br=b.size/2;
      const dx=(b.x+br)-acx;
      const dy=(b.y+br)-acy;
      const minimum=(ar+br)*.82;
      const d2=dx*dx+dy*dy;
      if(d2>=minimum*minimum||d2<=.000001)continue;
      const distance=Math.sqrt(d2);
      const nx=dx/distance, ny=dy/distance;
      const push=(minimum-distance)*.03;
      a.x-=nx*push; a.y-=ny*push;
      b.x+=nx*push; b.y+=ny*push;
      a.vx-=nx*.008; a.vy-=ny*.008;
      b.vx+=nx*.008; b.vy+=ny*.008;
      clampPosition(a);
      clampPosition(b);
    }
  }
}

/* n = name shown, u = direct RSS feeds, f = keyword filter (for general feeds),

const NEWS_REL=/saham|ihsg|bursa|emiten|\bidx\b|\bbei\b|dividen|rups|\bipo\b|obligasi|investor|rupiah|laba|bank|pasar modal|\bstocks?\b|shares|equit|\bjci\b|dividend|\bbonds?\b|market|capital/i;

function timeAgo(d){
  const s=Math.max(0,(Date.now()-d.getTime())/1000);
  if(s<3600)return Math.max(1,Math.floor(s/60))+' min ago';
  if(s<86400){const h=Math.floor(s/3600);return h+(h===1?' hour ago':' hours ago');}
  const dd=Math.floor(s/86400);return dd+(dd===1?' day ago':' days ago');
}
function fetchT(url,ms){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),ms);
  return fetch(url,{signal:ctl.signal}).finally(()=>clearTimeout(t));
}
/* result: {raw: items in the feed, items: items kept after filtering}; raw=0 counts as a failure */
function parseRss(text,label,filter,force){
  const xml=new DOMParser().parseFromString(text,'text/xml');
  const nodes=[...xml.querySelectorAll('item')];
  const items=nodes.map(it=>{
    const g=sel=>((it.querySelector(sel)||{}).textContent||'').trim();
    const rs=g('source');
    let title=g('title');
    if(rs&&title.endsWith(' - '+rs))title=title.slice(0,-(rs.length+3));
    let d=new Date(g('pubDate')); if(isNaN(d))d=new Date();
    return {title:title,link:g('link'),source:force?label:(rs||label||''),date:d};
  }).filter(n=>n.title&&n.link&&(!filter||NEWS_REL.test(n.title)));
  return {raw:nodes.length,items:items};
}
async function fetchOneFeed(rss,label,filter,force){
  let lastErr;
  /* 1) through a CORS proxy (the proxy that worked last is tried first) */
  for(let k=0;k<NEWS_PROXIES.length;k++){
    const pi=(newsProxyPref+k)%NEWS_PROXIES.length;
    try{
      const r=await fetchT(NEWS_PROXIES[pi](rss),6000);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const res=parseRss(await r.text(),label,filter,force);
      if(!res.raw)throw new Error('Empty');
      newsProxyPref=pi;
      return res.items;   /* may be empty if every item was filtered out */
    }catch(e){lastErr=e;}
  }
  /* 2) last resort: rss2json (supports CORS without a proxy) */
  try{
    const r=await fetchT('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss),7000);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.status!=='ok'||!Array.isArray(j.items)||!j.items.length)throw new Error('Empty');
    return j.items.map(it=>{
      let d=new Date(String(it.pubDate||'').replace(' ','T')+'Z'); if(isNaN(d))d=new Date();
      let title=(it.title||'').trim();
      if(label&&title.endsWith(' - '+label))title=title.slice(0,-(label.length+3));
      return {title:title,link:(it.link||'').trim(),source:label||'',date:d};
    }).filter(n=>n.title&&n.link&&(!filter||NEWS_REL.test(n.title)));
  }catch(e){lastErr=e;}
  throw lastErr||new Error('Failed to load');
}
async function fetchNews(onPartial){
  const seen=new Set(), all=[];
  /* newest first, but at most NEWS_PER_SOURCE per outlet so every tab has content */
  const build=()=>{
    all.sort((a,b)=>b.date-a.date);
    const cnt={}, out=[];
    for(const n of all){
      cnt[n.source]=(cnt[n.source]||0)+1;
      if(cnt[n.source]<=NEWS_PER_SOURCE)out.push(n);
      if(out.length>=NEWS_LIMIT)break;
    }
    return out;
  };
  const add=list=>{
    let changed=false;
    list.forEach(n=>{
      const k=n.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,70);
      if(!seen.has(k)){seen.add(k);all.push(n);changed=true;}
    });
    if(changed&&onPartial)onPartial(build());
  };
  await Promise.all(NEWS_SOURCES.map(async s=>{
    let got=0;
    await Promise.all((s.u||[]).map(u=>fetchOneFeed(u,s.n,s.f,false).then(l=>{got+=l.length;add(l);}).catch(()=>{})));
    if(!got){   /* direct feed failed -> Google News search limited to this outlet */
      try{add(await fetchOneFeed(newsRssUrl('forex'+' site:'+s.g+' when:7d',s.en),s.n,false,true));}catch(_){}
    }
  }));
  if(!all.length)throw new Error('Failed to load');
  return build();
}
function renderNews(list){
  const box=document.getElementById('newsList'), tabs=document.getElementById('newsTabs'); if(!box)return;
  const names=NEWS_SOURCES.map(s=>s.n).filter(n=>list.some(x=>x.source===n));
  if(newsFilter!=='All'&&names.indexOf(newsFilter)<0)newsFilter='All';
  if(tabs){
    const sig=names.join('|');
    if(tabs._sig!==sig){
      tabs._sig=sig; tabs.innerHTML='';
      ['All'].concat(names).forEach(n=>{
        const b=document.createElement('button'); b.className='newsTab'; b.dataset.n=n; b.textContent=n;
        b.onclick=()=>{
          newsFilter=n;
          tabs.querySelectorAll('.newsTab').forEach(x=>x.classList.toggle('active',x===b));
          b.scrollIntoView({behavior:'auto',inline:'center',block:'nearest'});
          renderNews(newsCache||[]);
          box.scrollTop=0;
        };
        tabs.appendChild(b);
      });
    }
    tabs.querySelectorAll('.newsTab').forEach(x=>x.classList.toggle('active',x.dataset.n===newsFilter));
  }
  const shown=newsFilter==='All'?list:list.filter(x=>x.source===newsFilter);
  const frag=document.createDocumentFragment();
  shown.forEach(n=>{
    const a=document.createElement('a'); a.className='newsItem'; a.href=n.link; a.target='_blank'; a.rel='noopener';
    const t=document.createElement('div'); t.className='newsTitle'; t.textContent=n.title;
    const m=document.createElement('div'); m.className='newsMeta'; m.textContent=(n.source?n.source+' · ':'')+timeAgo(n.date);
    a.appendChild(t); a.appendChild(m); frag.appendChild(a);
  });
  box.textContent='';
  if(shown.length)box.appendChild(frag);
  else box.innerHTML='<div class="newsState">No news from this source yet.</div>';
  const up=new Date(newsTs);
  document.getElementById('newsCount').textContent=shown.length+' news · updated '+String(up.getHours()).padStart(2,'0')+':'+String(up.getMinutes()).padStart(2,'0');
}
/* fetch fresh news in the background; the cache is shown immediately */
async function refreshNews(){
  if(newsBusy)return;
  newsBusy=true;
  try{
    /* show partial results as soon as any source answers (no need to wait for all) */
    const full=await fetchNews(function(part){
      newsCache=part; newsTs=Date.now(); saveNews();
      const ov=document.getElementById('newsOverlay');
      if(ov&&ov.classList.contains('show'))renderNews(newsCache);
    });
    newsCache=full; newsTs=Date.now(); saveNews();
    const ov=document.getElementById('newsOverlay');
    if(ov&&ov.classList.contains('show'))renderNews(newsCache);
  }catch(e){
    const ov=document.getElementById('newsOverlay');
    if(!newsCache&&ov&&ov.classList.contains('show')){
      document.getElementById('newsList').innerHTML='<div class="newsState">Failed to load news.<br><button class="newsRetry" id="newsRetry">Try again</button></div>';
      document.getElementById('newsRetry').onclick=()=>refreshNews();
    }
  }finally{newsBusy=false;}
}
async function openNews(){
  let ov=document.getElementById('newsOverlay');
  if(!ov){
    ov=document.createElement('div'); ov.id='newsOverlay'; ov.className='newsOverlay';
    ov.innerHTML='<div class="newsPanel"><div class="newsHead"><div><div class="newsHeadTitle">Forex News</div><div id="newsCount" class="newsHeadSub"></div></div><button id="newsClose" class="newsClose" aria-label="Close">×</button></div><div id="newsTabs" class="newsTabs"></div><div id="newsList" class="newsListBox"></div></div>';
    document.querySelector('.app').appendChild(ov);

    ov.addEventListener('click',e=>{if(performance.now()-(ov.__t||0)<500){e.preventDefault();e.stopPropagation();}},true);

  if(newsCache)renderNews(newsCache);
  else{document.getElementById('newsList').innerHTML='<div class="newsState">Loading news…</div>';document.getElementById('newsCount').textContent='';}
  if(!newsCache||Date.now()-newsTs>NEWS_REFRESH_MS)refreshNews();
}

<script>
(function(){
  const landing=document.getElementById('landing'), toast=document.getElementById('exitToast');
  let onLanding=true, armed=false, armTimer=null, toastTimer=null;
  function showToast(){toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2000)}
  function closeAllPopups(){
    var any=false;
    var o=document.getElementById('overlay'); if(o&&o.classList.contains('show')){any=true; try{closePopup()}catch(_){o.classList.remove('show')}}
    ['qrOverlay','newsOverlay','fxOverlay'].forEach(function(id){var el=document.getElementById(id); if(el&&el.classList.contains('show')){any=true; el.classList.remove('show');}});
    var m=document.getElementById('pageMenu'); if(m&&m.classList.contains('show')){any=true; try{setMenuOpen(false)}catch(_){m.classList.remove('show')}}
    document.querySelectorAll('.rankMenu.show,.sortMenu.show').forEach(function(el){any=true; el.classList.remove('show');});
    document.querySelectorAll('.rankBtn.open,.funnelBtn.open').forEach(function(el){el.classList.remove('open');});
    var sr=document.getElementById('searchResults'); if(sr&&sr.classList.contains('show')){any=true; try{closeSearch()}catch(_){sr.classList.remove('show')}}
    return any;
  }
  window.__closeAllPopups=closeAllPopups;
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAllPopups();});
  // riwayat halaman (bubble/list) supaya tombol back mundur satu halaman
  let pages=[], restoring=false;
  const _origSet=window.setViewMode;
  if(typeof _origSet==='function'){
    window.setViewMode=function(m){
      _origSet(m);
      if(!restoring && !onLanding && pages.length && pages[pages.length-1]!==m) pages.push(m);
    };
  }
  function goBubble(){ if(!onLanding)return; onLanding=false; landing.classList.add('hide'); pages=[(typeof viewMode!=='undefined'?viewMode:'bubble')]; }
  function goLanding(){ closeAllPopups(); pages=[]; onLanding=true; landing.classList.remove('hide'); }
  // Gambar bisa digeser ke segala arah (melayang); geser ke bawah untuk masuk ke halaman bubble
  const hero=document.getElementById('heroDrag');
  document.getElementById('goBtn').addEventListener('click',goBubble);
  let dragging=false,px=0,py=0,dx=0,dy=0,lt=0,vy=0,pid=null;
  function setHero(x,y){
    const rot=Math.max(-14,Math.min(14,x/18));
    hero.style.transform='translate3d('+x+'px,'+y+'px,0) rotate('+rot+'deg) scale(1.03)';
  }
  hero.addEventListener('pointerdown',e=>{
    if(!onLanding)return; dragging=true; pid=e.pointerId; px=e.clientX; py=e.clientY; dx=dy=0; lt=performance.now(); vy=0;
    hero.classList.remove('spring'); hero.classList.add('dragging');
    try{hero.setPointerCapture(pid)}catch(_){}
  });
  hero.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const now=performance.now(), ndy=e.clientY-py;
    vy=(ndy-dy)/Math.max(1,now-lt); lt=now;
    dx=e.clientX-px; dy=ndy; setHero(dx,dy);
  });
  function endDrag(){
    if(!dragging)return; dragging=false; hero.classList.remove('dragging');
    if(dy>110||(dy>40&&vy>0.6)){ goBubble(); setTimeout(()=>{hero.classList.remove('spring');hero.style.transform=''},500); }
    else { hero.classList.add('spring'); hero.style.transform=''; }
  }
  hero.addEventListener('pointerup',endDrag);
  hero.addEventListener('pointercancel',endDrag);
  landing.addEventListener('wheel',e=>{if(e.deltaY<-10)goBubble()},{passive:true});
  document.addEventListener('keydown',e=>{if(onLanding&&e.key==='ArrowDown')goBubble()});
  // Tombol back: bubble -> landing -> (back 2x) keluar
  try{ history.replaceState({g:0},''); history.pushState({g:1},''); }catch(_){}
  window.addEventListener('popstate',()=>{
    if(closeAllPopups()){ try{history.pushState({g:1},'')}catch(_){} return; }
    if(!onLanding && pages.length>1){
      pages.pop(); restoring=true;
      try{ window.setViewMode(pages[pages.length-1]); }finally{ restoring=false; }
      try{history.pushState({g:1},'')}catch(_){} return;
    }
    if(!onLanding){ goLanding(); try{history.pushState({g:1},'')}catch(_){} return; }
    if(armed){ clearTimeout(armTimer); armed=false; try{history.back()}catch(_){} return; }
    armed=true; showToast(); try{history.pushState({g:1},'')}catch(_){}
    armTimer=setTimeout(()=>{armed=false},2000);
  });
  // hook untuk simpan / pulihkan posisi halaman (dipakai saat kembali dari tautan luar)
  window.__uiGet=function(){return {onLanding:onLanding,pages:pages.slice()};};
  window.__uiRestore=function(st){
    if(!st||st.onLanding)return;
    onLanding=false; landing.classList.add('hide');
    pages=(st.pages&&st.pages.length)?st.pages.slice():[st.viewMode||'bubble'];
  };
})();
</script>
<script>
/* Kembali dari tautan luar (chart / website / explorer / berita):
   posisi halaman disimpan, lalu dipulihkan -> popup terbuka lagi, back berikutnya
   menutup popup, back lagi mundur ke halaman bubble/list sesuai riwayat. */
(function(){
  var KEY='__uiResume', TTL=10*60*1000, lastFilter=null;
  function wrap(name,kind){
    var f=window[name]; if(typeof f!=='function')return;
    window[name]=function(n){ lastFilter={kind:kind,name:n}; return f.apply(this,arguments); };
  }
  wrap('applyMarketFilter','market'); wrap('applyTimeFilter','time');
  function save(){
    try{
      var u=window.__uiGet?window.__uiGet():{onLanding:true,pages:[]};
      if(u.onLanding)return;
      var ov=document.getElementById('newsOverlay');
      localStorage.setItem(KEY,JSON.stringify({
        ts:Date.now(), onLanding:false, viewMode:viewMode, pages:u.pages,
        filter:lastFilter, popupId:(selectedStock?selectedStock.id:null), popupStock:(selectedStock||null),
        newsOpen:!!(ov&&ov.classList.contains('show'))
      }));
    }catch(_){}
  }
  var _open=window.open;
  window.open=function(){ save(); return _open.apply(window,arguments); };
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest&&e.target.closest('a[target="_blank"]');
    if(a)save();
  },true);
  function clear(){ try{localStorage.removeItem(KEY)}catch(_){} }
  // tab/app tidak di-reload (bfcache atau tab terpisah): tidak perlu dipulihkan
  window.addEventListener('pageshow',function(e){ if(e.persisted)clear(); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden)setTimeout(clear,0); });

  var st=null;
  try{ st=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(_){}
  clear();
  if(!st||!st.ts||Date.now()-st.ts>TTL||st.onLanding)return;

  function done(){ document.documentElement.classList.remove('uiResuming'); }
  try{
    window.__uiRestore(st);
    try{ window.setViewMode(st.viewMode||'bubble'); }catch(_){}
    // popup & berita langsung dibuka (pakai data tersimpan), tanpa menunggu data pasar
    if(st.popupId){
      try{
        if(!stockMap.get(st.popupId)&&st.popupStock)stockMap.set(st.popupId,st.popupStock);
        if(stockMap.get(st.popupId))openPopup(st.popupId);
      }catch(err){console.warn('popup restore',err);}
    }
    if(st.newsOpen){ try{openNews();}catch(_){} }
  }catch(err){console.warn('restore failed',err);}
  // filter menu diterapkan begitu data pasar siap
  var tries=0;
  (function wait(){
    if(allStocks&&allStocks.length){
      try{
        if(st.filter&&st.filter.name){
          if(st.filter.kind==='market')applyMarketFilter(st.filter.name);
          else applyTimeFilter(st.filter.name);
        }
      }catch(err){console.warn('filter restore',err);}
      done(); return;
    }
    if(++tries<100)setTimeout(wait,200); else done();
  })();
  setTimeout(done,1500);
})();
</script>

    '<div class="fxSwapRow"><button id="fxSwap" class="fxSwap" aria-label="Tukar"><svg viewBox="0 0 24 24"><path d="M7 4v14M3.5 14.5L7 18l3.5-3.5"/><path d="M17 20V6M13.5 9.5L17 6l3.5 3.5"/></svg></button></div>'+
    '<div class="fxLbl">KE</div>'+
    '<div class="fxBox"><img id="fxFlagB" alt=""><div id="fxRes" class="fxRes">0</div><select id="fxB" class="fxSel"></select></div>'+
    '<div id="fxRate" class="fxRate"></div></div>';
  document.querySelector('.app').appendChild(ov);
  var $=function(i){return document.getElementById(i);};
  var selA=$('fxA'), selB=$('fxB'), amt=$('fxAmt'), res=$('fxRes'), rate=$('fxRate');
  var U={USD:1}, built=0, poll=null;
  var STORE='fx_conv_pref_v1';
  function usFlag(){var h=10/13,t='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#b22234"/>';
    for(var i=1;i<13;i+=2)t+='<rect y="'+(i*h)+'" width="10" height="'+h+'" fill="#fff"/>';
    t+='<rect width="5" height="'+(7*h)+'" fill="#3c3b6e"/>';
    for(var r=0;r<5;r++)for(var c=0;c<6;c++)t+='<circle cx="'+(0.45+c*0.82)+'" cy="'+(0.4+r*0.9)+'" r="0.22" fill="#fff"/>';
    return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(t+'</svg>');}
  var US_FLAG=usFlag();
  function flagOf(c){if(c==='USD')return US_FLAG; var x=FX_MAP[c]; return 'https://flagcdn.com/w80/'+(x?x.i.toLowerCase():'un')+'.png';}
  function nameOf(c){if(c==='USD')return 'Amerika Serikat (Dolar AS)'; var x=FX_MAP[c]; return x?fxCountry(x.i):c;}
  function buildRates(){
    var n=0, u={USD:1};
    (typeof allStocks!=='undefined'?allStocks:[]).forEach(function(s){
      var c=fxCur(s.symbol), p=Number(s.current_price); if(!c||!(p>0))return;
      u[c]=(['EUR','GBP','AUD','NZD'].indexOf(c)>=0)?1/p:p; n++;
    });
    U=u; return n;
  }
  function fillSelects(){
    var codes=Object.keys(U).sort(function(a,b){
      if(a==='USD')return -1; if(b==='USD')return 1;
      var oa=FX_ORD[a]==null?9999:FX_ORD[a], ob=FX_ORD[b]==null?9999:FX_ORD[b]; return oa-ob;
    });
    var pa=selA.value||'USD', pb=selB.value||'IDR';
    try{var p=JSON.parse(localStorage.getItem(STORE)||'null'); if(p&&!built){pa=p.a||pa;pb=p.b||pb;}}catch(_){}
    var html=codes.map(function(c){return '<option value="'+c+'">'+c+' — '+nameOf(c).replace(/</g,'')+'</option>';}).join('');
    selA.innerHTML=html; selB.innerHTML=html;
    selA.value=U[pa]?pa:'USD'; selB.value=U[pb]?pb:(U.IDR?'IDR':codes[1]||'USD');
    built=1;
  }
  function fmt(v){
    if(!isFinite(v))return '0';
    var a=Math.abs(v), d=a>=1000?2:a>=1?4:a>=0.01?6:8;
    try{return new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(v);}catch(_){return String(v);}
  }
  function parseAmt(){
    var t=String(amt.value).replace(/\s/g,'');
    if(t.indexOf(',')>=0&&t.indexOf('.')<0)t=t.replace(',','.'); else t=t.replace(/,/g,'');
    var n=parseFloat(t); return isFinite(n)?n:0;
  }
  function calc(){
    var a=selA.value, b=selB.value;
    $('fxFlagA').src=flagOf(a); $('fxFlagB').src=flagOf(b);
    if(!U[a]||!U[b]){res.textContent='…'; rate.textContent='Memuat kurs…'; return;}
    var r=U[b]/U[a];
    res.textContent=fmt(parseAmt()*r);
    rate.innerHTML='1 '+a+' = '+fmt(r)+' '+b+'<br>1 '+b+' = '+fmt(1/r)+' '+a;
    try{localStorage.setItem(STORE,JSON.stringify({a:a,b:b}));}catch(_){}
  }
  function refresh(){var n=buildRates(); if(n&&(!built||selA.options.length!==Object.keys(U).length))fillSelects(); calc(); return n;}
  function open(){
    ov.classList.add('show'); refresh();
    clearInterval(poll); poll=setInterval(function(){if(!ov.classList.contains('show')){clearInterval(poll);return;} refresh();},1500);
  }
  function close(){ov.classList.remove('show'); clearInterval(poll); amt.blur();}
  window.__openFx=open;
  $('fxClose').addEventListener('click',close);
  ov.addEventListener('pointerdown',function(e){if(e.target===ov){e.stopPropagation();close();}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  amt.addEventListener('input',calc); amt.addEventListener('focus',function(){amt.select();});
  selA.addEventListener('change',calc); selB.addEventListener('change',calc);
  $('fxSwap').addEventListener('click',function(){var t=selA.value; selA.value=selB.value; selB.value=t; calc();});
})();
</script>

</body>
</html>
